<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sensor catalog | Smart Building</title><link rel="stylesheet" href="/static/bright_theme.css"><link rel="stylesheet" href="/static/workspace.css?v=2"></head>
{% set workspace_title = 'Sensor catalog' %}{% set workspace_nav = '/sensor-profile-manager' %}
<body class="workspace">{% include 'workspace_start.html' %}
<section class="header"><p class="eyebrow">Management workspace</p><h1>Sensor catalog</h1><p>Register physical sensors and review the profiles that use them.</p></section>

<div class="section-tabs" role="tablist" aria-label="Sensor catalog sections"><button role="tab" id="catalogTab" aria-controls="catalogPanel" aria-selected="true" onclick="catalogTab(false)">Catalog</button><button role="tab" id="catalogFormTab" aria-controls="catalogFormPanel" aria-selected="false" onclick="catalogTab(true)">Add / edit sensor</button></div>
<section role="tabpanel" id="catalogPanel" aria-labelledby="catalogTab"><div class="toolbar"><label for="sensorSearch">Find a sensor</label><input id="sensorSearch" placeholder="Model, manufacturer or code"><button onclick="loadCatalog()">Refresh</button></div><div class="tool-list" id="sensorList"></div></section>
<section role="tabpanel" id="catalogFormPanel" aria-labelledby="catalogFormTab" hidden><div class="card"><h2 id="sensorFormTitle">Add sensor</h2><form id="sensorForm"><input type="hidden" name="id"><div class="form-grid">
<label>Sensor code<input name="sensor_code" required placeholder="ENV_SENSOR_V1"></label><label>Model<input name="model" required placeholder="BME280"></label>
<label>Manufacturer<input name="manufacturer" placeholder="Bosch"></label><label>Use case<input name="use_case" required placeholder="environment"></label>
<label>Protocol<select name="protocol"><option value="i2c">I?C</option><option value="spi">SPI</option><option value="analog">Analog</option><option value="digital">Digital</option><option value="uart">UART</option></select></label><label>Default bus<input name="default_bus"></label>
<label>Default address<input name="default_address" placeholder="0x76"></label><label>Datasheet URL<input name="datasheet_url" type="url"></label></div>
<label>Description<textarea name="description" style="width:100%" rows="3"></textarea></label><label><input name="enabled" type="checkbox" checked> Enabled</label><p><button type="submit">Save sensor</button> <button type="button" class="secondary" onclick="newSensor()">Clear form</button></p></form></div></section><p id="catalogMessage" role="status"></p>
<script src="/static/management_tools.js?v=1"></script>
<script>initCatalog();</script>
{% include 'workspace_end.html' %}</body></html>
