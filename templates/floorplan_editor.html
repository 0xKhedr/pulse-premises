<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Floor plans | Smart Building</title><link rel="stylesheet" href="/static/bright_theme.css"><link rel="stylesheet" href="/static/workspace.css?v=2"></head>
{% set workspace_title = 'Floor plans' %}{% set workspace_nav = '/admin/setup' %}
<body class="workspace">{% include 'workspace_start.html' %}
<section class="header"><p class="eyebrow">Maps &amp; rooms</p><h1>Floor plans</h1><p>Choose a floor to draw rooms, place hardware or open the live map.</p></section>
<div class="toolbar"><label for="floorSearch">Find a floor</label><input id="floorSearch" placeholder="Client, site, building or floor"><a class="btn" href="/admin/setup">Manage floors &amp; uploads</a></div>
<p id="floorMessage" role="status"></p><div class="tool-list" id="floorPlans"></div>
<script src="/static/management_tools.js?v=1"></script><script>
let floorPlans=[];
function renderFloorPlans(){const search=document.getElementById('floorSearch').value.toLowerCase();document.getElementById('floorPlans').innerHTML=floorPlans.filter(f=>JSON.stringify(f).toLowerCase().includes(search)).map(f=>`<article class="card"><span class="pill">Floor ${html(f.floor_number ?? f.id)}</span><h2>${html(f.name)}</h2><p>${html(f.client_name)} / ${html(f.site_name)} / ${html(f.building_name)}</p><p>${f.image_path?'Floor plan ready':'Upload a floor plan in asset setup'}</p><p><a class="btn" href="/floor-editor?floor_id=${Number(f.id)}">Edit rooms</a> <a class="btn secondary" href="/floor-live-view?floor_id=${Number(f.id)}">Live view</a></p><a href="/node-placement-editor?floor_id=${Number(f.id)}">Place devices</a></article>`).join('')||'<div class="empty-state">No floors found.</div>';}
document.getElementById('floorSearch').addEventListener('input',renderFloorPlans);
requestJSON('/floors').then(f=>{floorPlans=f;renderFloorPlans();}).catch(e=>document.getElementById('floorMessage').textContent=e.message);
</script>{% include 'workspace_end.html' %}</body></html>
