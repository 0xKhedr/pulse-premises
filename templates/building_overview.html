<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Building overview | Smart Building</title><link rel="stylesheet" href="/static/bright_theme.css"><link rel="stylesheet" href="/static/workspace.css?v=2"></head>
{% set workspace_title = 'Building overview' %}{% set workspace_nav = '/admin/setup' %}
<body class="workspace">{% include 'workspace_start.html' %}
<div class="header"><p class="eyebrow">Your spaces</p><h1>Building overview</h1><p>Select a building to explore its floors and connected hardware.</p></div>
<div class="toolbar"><label for="buildingSelect">Building</label><select id="buildingSelect" onchange="loadBuilding()"></select><a class="btn secondary" href="/admin/setup">Manage assets</a></div><p id="buildingMessage" role="status"></p><div id="content" class="tool-list"></div>
<script src="/static/management_tools.js?v=1"></script><script>
async function loadBuilding(){const id=document.getElementById('buildingSelect').value;if(!id)return;try{const data=await requestJSON(`/buildings/${Number(id)}/overview`);document.getElementById('buildingMessage').textContent=data.building.name;document.getElementById('content').innerHTML=data.floors.map(f=>`<article class="card"><span class="pill">Floor ${html(f.floor_number ?? f.id)}</span><h2>${html(f.name)}</h2><p>Explore readings and manage the floor plan.</p><p><a class="btn" href="/floor-live-view?floor_id=${Number(f.id)}">Open live floor</a> <a class="btn secondary" href="/floor-editor?floor_id=${Number(f.id)}">Edit rooms</a></p><a href="/node-placement-editor?floor_id=${Number(f.id)}">Place devices</a></article>`).join('')||'<div class="empty-state">No floors yet. Add floors from asset setup.</div>';}catch(e){document.getElementById('buildingMessage').textContent=e.message;}}
requestJSON('/buildings').then(buildings=>{const select=document.getElementById('buildingSelect');select.innerHTML=buildings.map(b=>`<option value="${Number(b.id)}">${html(b.name)}</option>`).join('');const id=new URLSearchParams(location.search).get('building_id');if(buildings.some(b=>String(b.id)===id))select.value=id;if(!buildings.length)document.getElementById('buildingMessage').textContent='No buildings yet.';loadBuilding();}).catch(e=>document.getElementById('buildingMessage').textContent=e.message);
</script>{% include 'workspace_end.html' %}</body></html>
