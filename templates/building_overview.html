
<!DOCTYPE html>
<html>
<head>
<title>Building Overview</title>
<link rel="stylesheet" href="/static/bright_theme.css">

<style>
body{
    font-family:Arial;
    margin:20px;
    background:#f5f5f5;
}

.card{
    background:white;
    padding:15px;
    margin-bottom:15px;
    border-radius:10px;
    box-shadow:0 2px 10px rgba(0,0,0,.15);
}

.floorBtn{
    display:block;
    width:100%;
    padding:12px;
    margin-top:10px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    background:#1976d2;
    color:white;
    font-weight:bold;
}
</style>
</head>

<body>

<div id="content"></div>

<script>

const params =
    new URLSearchParams(window.location.search);

const buildingId =
    params.get("building_id");

async function loadBuilding(){

    const res =
        await fetch(
            `/buildings/${buildingId}/overview`
        );

    const data =
        await res.json();

    let html = `
        <div class="card">
            <h1>${data.building.name}</h1>
            <p>Building ID: ${data.building.id}</p>
        </div>
    `;

    data.floors.forEach(floor => {

        html += `
            <div class="card">

                <h3>${floor.name}</h3>

                <button
                    class="floorBtn"
                    onclick="
                        window.location.href=
                        '/floor-live-view?floor_id=${floor.id}'
                    "
                >
                    Open Floor
                </button>

            </div>
        `;
    });

    document.getElementById("content")
        .innerHTML = html;
}

loadBuilding();

</script>

</body>
</html>
