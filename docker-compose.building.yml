# Image-only deployment for a building server. Development overrides are not
# loaded when this file is selected explicitly.
name: ${COMPOSE_PROJECT_NAME:-pulse-building}

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  sbms-app:
    image: ${SBMS_IMAGE:?Set SBMS_IMAGE in .env.building}
    restart: unless-stopped
    init: true
    env_file: .env.building
    environment:
      DB_FILE: /app/data/smarthome.db
      PORT: "8000"
      LOCAL_TEST_MODE: "false"
      PREVIEW_MODE: "false"
      TTN_BASE_URL: http://stack:1885
    ports:
      - "${SBMS_BIND_ADDRESS:-0.0.0.0}:${SBMS_HTTP_PORT:-8000}:8000"
    volumes:
      - sbms-data:/app/data
      - sbms-uploads:/app/uploads
    depends_on:
      stack:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging: *logging

  stack:
    image: ${TTS_IMAGE:-thethingsnetwork/lorawan-stack:3.36.2}
    entrypoint: ["ttn-lw-stack", "-c", "/config/ttn-lw-stack.yml"]
    command: ["start"]
    restart: unless-stopped
    environment:
      TTN_LW_IS_DATABASE_URI: postgres://ttn:${TTS_POSTGRES_PASSWORD:?Generate .env.building first}@postgres:5432/ttn_lorawan?sslmode=disable
      TTN_LW_REDIS_ADDRESS: redis:6379
      TTN_LW_CONSOLE_OAUTH_CLIENT_SECRET: ${TTS_CONSOLE_SECRET:?Generate .env.building first}
      TTN_LW_CONSOLE_UI_CANONICAL_URL: http://${TTS_HOST:?Set the building server address}:1885/console
      TTN_LW_HTTP_COOKIE_BLOCK_KEY: ${TTS_COOKIE_BLOCK_KEY:?Generate .env.building first}
      TTN_LW_HTTP_COOKIE_HASH_KEY: ${TTS_COOKIE_HASH_KEY:?Generate .env.building first}
      TTN_LW_CLUSTER_KEYS: ${TTS_CLUSTER_KEY:?Generate .env.building first}
    ports:
      - "${SBMS_BIND_ADDRESS:-0.0.0.0}:1885:1885"
      - "${SBMS_BIND_ADDRESS:-0.0.0.0}:1700:1700/udp"
      - "${SBMS_BIND_ADDRESS:-0.0.0.0}:1887:1887"
    volumes:
      - type: bind
        source: ./deploy/stack/ttn-lw-stack.yml
        target: /config/ttn-lw-stack.yml
        read_only: true
        bind:
          create_host_path: false
      - tts-blob:/srv/ttn-lorawan/public/blob
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:1885/healthz"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    logging: *logging

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ttn
      POSTGRES_DB: ttn_lorawan
      POSTGRES_PASSWORD: ${TTS_POSTGRES_PASSWORD:?Generate .env.building first}
    volumes:
      - tts-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ttn -d ttn_lorawan"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *logging

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    restart: unless-stopped
    volumes:
      - tts-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *logging

volumes:
  sbms-data:
  sbms-uploads:
  tts-postgres:
  tts-redis:
  tts-blob:
