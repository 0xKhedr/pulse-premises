# Local development conveniences.
#
# Opt in to live template/static mounts with:
#
#     docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
#
# Ordinary `docker compose up` uses the self-contained deployment image.
#
# Templates and static assets are baked into the image by COPY, so without
# these mounts every edit needs a full rebuild before it shows up. Mounted
# read-only: the app only ever reads them, and :ro keeps the non-root
# container user from writing to your working tree.
services:
  sbms-app:
    volumes:
      - ./templates:/app/templates:ro
      - ./static:/app/static:ro
