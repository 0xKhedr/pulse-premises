name: CI

on:
  push:
  pull_request:
  workflow_call:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      LOCAL_TEST_MODE: "true"
      ALERT_EMAIL_ENABLED: "false"
      TTN_BASE_URL: http://127.0.0.1:9
      THINGSBOARD_URL: http://127.0.0.1:9
      THINGSBOARD_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check app tests tools/prepare_building.py tools/register_ttn_devices.py tools/hardware_acceptance.py tools/generate_lorawan_credentials.py tools/configure_local_ttn.py tools/reconcile_legacy_database.py tools/sync_ttn_credentials.py
      - run: python -m compileall -q app tests tools
      - run: python -m pytest -q
      - name: Prepare a fresh building installation
        run: python tools/prepare_building.py --host 192.0.2.10 --admin-email admin@building.local
      - name: Build SBMS from the repository
        run: docker compose --env-file .env.building -f docker-compose.building.yml build sbms-app
      - name: Initialize The Things Stack
        run: bash linux/initialize-building.sh admin@building.local
        env:
          TTS_BOOTSTRAP_PASSWORD: ci-only-stack-password-12345
      - name: Start and check the building deployment
        run: |
          docker compose --env-file .env.building -f docker-compose.building.yml up -d --wait --wait-timeout 180
          docker compose --env-file .env.building -f docker-compose.building.yml exec -T sbms-app python -c 'import os, pathlib, urllib.request; assert os.getuid() == 1000; assert urllib.request.urlopen("http://localhost:8000/healthz").status == 200; p = pathlib.Path("/app/uploads/.ci-write-check"); p.write_text("ok"); p.unlink(); assert not list(pathlib.Path("/app/firmware").rglob("lorawan_credentials.h"))'
      - name: Show deployment logs on failure
        if: failure()
        run: docker compose --env-file .env.building -f docker-compose.building.yml logs --no-color --tail 100
      - name: Stop CI containers
        if: always()
        run: docker compose --env-file .env.building -f docker-compose.building.yml down
